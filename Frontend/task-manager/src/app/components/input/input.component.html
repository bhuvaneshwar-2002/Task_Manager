<div class="container">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div *ngFor="let field of fields" class="form-group">
            <label [for]="field.name">{{ field.label }}</label>
            <input *ngIf="field.type !== 'textarea'" [id]="field.name" [type]="field.type" formControlName="{{ field.name }}" />
            <textarea *ngIf="field.type === 'textarea'" [id]="field.name" formControlName="{{ field.name }}"></textarea>
            <small *ngIf="form.get(field.name)?.invalid && form.get(field.name)?.touched">
                <span *ngIf="form.get(field.name)?.hasError('required')">{{ field.label }} is required</span>
                <span *ngIf="form.get(field.name)?.hasError('email')">Invalid email format</span>
            </small>
        </div>
        <button type="submit" [disabled]="form.invalid">Submit</button>
    </form>
</div>
